name: WDTT owner-lab numeric worker visibility (synthetic only)
on:
  pull_request:
    branches: [feature/qwdtt-anon18-singlehash-owner-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wdtt-owner-worker-visibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-and-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict diff guard relative to PR28 candidate
        run: |
          set -euo pipefail
          base=40b16c1ac4563121f4ef496dd54fbf615ea040c2
          git cat-file -e "$base^{commit}"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files"
          cat "$RUNNER_TEMP/changed-files"
          test "$(wc -l < "$RUNNER_TEMP/changed-files")" -eq 6
          if grep -Ev '^(go_client/session.go|go_client/group.go|go_client/socks_telemetry.go|go_client/lab_worker_telemetry.go|go_client/lab_worker_telemetry_test.go|\.github/workflows/wdtt-worker-visibility-owner-test.yml)$' "$RUNNER_TEMP/changed-files"; then
            echo UNREVIEWED_WORKER_VISIBILITY_CHANGE >&2
            exit 1
          fi
          grep -Fq 'time.Sleep(30 * time.Minute); labStatus("TIME_LIMIT"); os.Exit(75)' go_client/lab_security.go
          grep -Fq 'case workers == 18 && (len(hashes) == 1 || len(hashes) == 2):' go_client/qwdtt_import.go
          git diff --exit-code "$base" -- go_client/lab_security.go go_client/qwdtt_import.go go_client/packet_pipe.go go_client/socks_service.go
      - name: Pinned Go SDK and QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user zstd gcc
          curl -fL --retry 2 --connect-timeout 20 --max-time 240 \
            https://github.com/ownik/entware-sdk/releases/download/v2026.07.04/entware-sdk-aarch64-3.10_gcc-8.4.0_glibc-2.27.Linux-x86_64.tar.zst \
            -o sdk.tar.zst
          echo 'd51f30c126425ebff203b107a1a0aa9d3a5844f6c481bc6ff4c117cadc208674  sdk.tar.zst' | sha256sum -c -
          mkdir sdk-root
          tar --zstd -xf sdk.tar.zst -C sdk-root --wildcards --wildcards-match-slash '*staging_dir/host/go/*'
          go_bin="$(find "$PWD/sdk-root" -type f -path '*/host/go/bin/go' -print -quit)"
          test -n "$go_bin"
          echo "GO_BIN=$go_bin" >> "$GITHUB_ENV"
          echo "GOPATH=$RUNNER_TEMP/wdtt-worker-gopath" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/wdtt-worker-gocache" >> "$GITHUB_ENV"
      - name: All short Go unit tests
        env:
          GOENV: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOTELEMETRY: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          cd go_client
          CGO_ENABLED=0 "$GO_BIN" test -mod=readonly -short -count=1 -timeout=300s ./...
      - name: Native Go race tests
        env:
          GOENV: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOTELEMETRY: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          cd go_client
          CGO_ENABLED=1 CC=/usr/bin/gcc "$GO_BIN" test -mod=readonly -race -short -count=1 -timeout=300s ./...
      - name: ARM64 and MIPSel synthetic meter execution under QEMU
        env:
          GOENV: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOTELEMETRY: 'off'
          GOOS: linux
          CGO_ENABLED: '0'
          GOMIPS: softfloat
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          cd go_client
          GOARCH=arm64 "$GO_BIN" test -mod=readonly -trimpath -buildvcs=false -c -o "$RUNNER_TEMP/worker-arm64.test"
          GOARCH=mipsle "$GO_BIN" test -mod=readonly -trimpath -buildvcs=false -c -o "$RUNNER_TEMP/worker-mipsle.test"
          qemu-aarch64 "$RUNNER_TEMP/worker-arm64.test" -test.run '^TestWDTTWorkerMeter' -test.timeout=120s
          qemu-mipsel "$RUNNER_TEMP/worker-mipsle.test" -test.run '^TestWDTTWorkerMeter' -test.timeout=120s
          file "$RUNNER_TEMP"/worker-*.test
          sha256sum "$RUNNER_TEMP"/worker-*.test
      - name: Local test only, no releases or artifacts
        run: |
          echo 'No ELF/IPK upload, no public credential, no router/VPS operation.'
